<!doctype html>
<html lang="es" class="theme-light scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/images/logo-dpiero-orange.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sistema POS D'Piero Restaurante & Parrilla para gestión en tiempo real de salón, cocina, órdenes y facturación."
    />
    <title>D'Piero • Restaurante, Parrilla & POS</title>
    <script>
      (function () {
        try {
          var saved = sessionStorage.getItem("app_theme");
          var root = document.documentElement;
          if (saved === "dark") {
            root.classList.add("theme-dark", "dark");
            root.classList.remove("theme-light");
          } else {
            root.classList.add("theme-light");
            root.classList.remove("theme-dark", "dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--md-sys-color-surface)] text-[var(--md-sys-color-on-surface)] antialiased min-h-screen selection:bg-[var(--md-sys-color-primary-container)] selection:text-[var(--md-sys-color-on-primary-container)] font-[family-name:var(--main-font)]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
